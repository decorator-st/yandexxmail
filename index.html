<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRITICAL SYSTEM FAILURE</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; background: #000; overflow: hidden; cursor: pointer; font-family: 'Courier New', monospace; touch-action: none; user-select: none; }
        
        #glitch-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 5; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.8) 0px, rgba(0, 0, 0, 0.8) 3px, transparent 3px, transparent 6px); animation: glitch 0.1s infinite; }
        @keyframes glitch { 0% { transform: translateY(0); } 50% { transform: translateY(30px); } 100% { transform: translateY(0); } }
        
        #virus-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(20, 0, 0, 0.98); color: #fff; z-index: 9999; text-align: left; padding: 15px; font-weight: bold; font-size: 16px; overflow: hidden; }
        #virus-overlay h1 { font-size: 24px; margin: 0 0 10px 0; animation: flash 0.2s infinite; color: #ff0000; text-align: center; text-shadow: 2px 2px 0 #000; text-transform: uppercase; }
        
        #terminal-text { margin-top: 10px; height: 60vh; overflow-y: hidden; color: #00ff00; font-size: 13px; text-shadow: 0 0 5px #00ff00; line-height: 1.2; }
        .threat-text { color: #ff3333; font-size: 16px; margin-top: 10px; text-align: center; background: #000; padding: 10px; border: 1px solid red; }
        
        #pay-btn { display: none; margin: 10px auto; padding: 12px 25px; background: yellow; color: black; font-size: 18px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; animation: pulse 0.5s infinite alternate; z-index: 10000; position: relative; width: 90%; max-width: 300px; }
        @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.05); } }
        
        #hint { position: fixed; bottom: 0; left: 0; right: 0; padding: 30px 16px; text-align: center; color: #fff; font-size: 18px; opacity: 0.7; transition: opacity 0.4s; pointer-events: none; z-index: 10; font-family: Arial, sans-serif; }
        #hint.hidden { opacity: 0; }

        #blocker { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999999; background: transparent; }
    </style>
</head>
<body>
    <div id="blocker"></div>
    <div id="glitch-overlay"></div>
    
    <div id="virus-overlay">
        <h1 id="title-text">⚠️ СИСТЕМА ВЗЛОМАНА ⚠️</h1>
        <div id="terminal-text"></div>
        <p class="threat-text" id="threat-dynamic">...</p>
        <button id="pay-btn">ОПЛАТИТЬ ШТРАФ (299 ₽)</button>
    </div>

    <div id="hint">Нажмите в любом месте, чтобы продолжить</div>

    <script>
        (function () {
            const hint = document.getElementById('hint');
            const virusOverlay = document.getElementById('virus-overlay');
            const glitchOverlay = document.getElementById('glitch-overlay');
            const payBtn = document.getElementById('pay-btn');
            const terminalText = document.getElementById('terminal-text');
            const threatDynamic = document.getElementById('threat-dynamic');
            const titleText = document.getElementById('title-text');
            const blocker = document.getElementById('blocker');
            
            let started = false;
            let wakeLock = null;
            const BLOCK_TIME = 3 * 60 * 1000; // 3 минуты в миллисекундах

            // Функция для удержания экрана
            async function keepScreenAwake() {
                try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
            }

            function triggerApocalypse() {
                // 1. ДЕРЖИМ ЭКРАН
                keepScreenAwake();

                // 2. ЛОВУШКА ДЛЯ КНОПКИ "НАЗАД"
                for (let i = 0; i < 10; i++) { history.pushState(null, "", window.location.href); }
                window.onpopstate = function () { history.pushState(null, "", window.location.href); };

                // 3. БЛОКИРУЕМ КЛИКИ
                blocker.style.display = 'block';

                hint.classList.add('hidden');
                glitchOverlay.style.display = 'block';
                virusOverlay.style.display = 'block';
                setTimeout(() => { payBtn.style.display = 'block'; }, 3000);

                // 4. ВЫБОР СЦЕНАРИЯ (Рандом: Госуслуги или Терроризм)
                let isGosuslugi = Math.random() < 0.5;

                if (isGosuslugi) {
                    titleText.innerText = "ВХОД В ГОСУСЛУГИ (УКРАИНА)";
                    threatDynamic.innerText = "Обнаружен несанкционированный вход в ваш аккаунт с IP-адреса Украины. Сессия перехвачена.";
                    var logs = [
                        "> Инициализация протокола перехвата...",
                        "> Поиск учетной записи: user@mail.ru",
                        "> Отправка запроса на сервер UA-01...",
                        "> Обход двухфакторной аутентификации...",
                        "> Подбор кода из СМС... 4 цифры",
                        "> Вход выполнен. IP: 185.65.xx.xx (Киев)",
                        "> Скачивание паспортных данных...",
                        "> Смена пароля...",
                        "> Привязка нового номера телефона...",
                        "> ДОСТУП К ГОСУСЛУГАМ ПОЛУЧЕН."
                    ];
                } else {
                    titleText.innerText = "СПОНСИРОВАНИЕ ТЕРРОРИЗМА";
                    threatDynamic.innerText = "Ваши средства переведены на счета запрещенных организаций. Счет заблокирован.";
                    var logs = [
                        "> Подключение к банковскому шлюзу...",
                        "> Баланс: 14 500 ₽",
                        "> Перевод: 14 500 ₽",
                        "> Получатель: FUND-TERRORISM-UA",
                        "> Статус: ИСПОЛНЕНО",
                        "> Блокировка счета по ст. 205 УК РФ...",
                        "> Передача данных в ФСБ...",
                        "> Возбуждено уголовное дело.",
                        "> Ожидайте повестку."
                    ];
                }

                let logIndex = 0;
                let logInterval = setInterval(() => {
                    if(logIndex < logs.length) {
                        terminalText.innerHTML += logs[logIndex] + "<br>";
                        terminalText.scrollTop = terminalText.scrollHeight;
                        logIndex++;
                    } else {
                        clearInterval(logInterval);
                        terminalText.innerHTML += "> УСТРОЙСТВО ЗАБЛОКИРОВАНО.<br>";
                    }
                }, 350);

                // 5. ПРОВЕРКА ТАЙМЕРА (ЧТОБЫ НЕЛЬЗЯ БЫЛО ПЕРЕЗАГРУЗИТЬ)
                let startTime = localStorage.getItem('virusStartTime');
                if (!startTime) {
                    startTime = Date.now();
                    localStorage.setItem('virusStartTime', startTime);
                }

                function checkTimer() {
                    let now = Date.now();
                    let elapsed = now - startTime;
                    let remaining = BLOCK_TIME - elapsed;

                    if (remaining > 0) {
                        // Если время еще не вышло — не даем выйти
                        window.onbeforeunload = function(e) {
                            e.preventDefault();
                            e.returnValue = "УСТРОЙСТВО ЗАБЛОКИРОВАНО. ЖДИТЕ.";
                            return e.returnValue;
                        };
                        // Перезапускаем проверку через секунду
                        setTimeout(checkTimer, 1000);
                    } else {
                        // Время вышло — снимаем блокировку
                        window.onbeforeunload = null;
                        localStorage.removeItem('virusStartTime');
                        blocker.style.display = 'none';
                        alert("БЛОКИРОВКА СНЯТА. ВЫ МОЖЕТЕ ВЫЙТИ.");
                    }
                }
                checkTimer();

                // 6. 50 ОКОН ПРИ КЛИКЕ
                payBtn.addEventListener('click', function() {
                    let count = 0;
                    let alertInterval = setInterval(() => {
                        alert("ОШИБКА: ОПЛАТА НЕ ПРОШЛА.");
                        count++;
                        if (count >= 50) clearInterval(alertInterval);
                    }, 50);
                });
            }

            function start() {
                if (started) return;
                started = true;

                // 1. ПОЛНОЭКРАННЫЙ РЕЖИМ (СКРЫВАЕТ ПАНЕЛЬ)
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(e => {});
                }

                // 2. ЗАПУСКАЕМ ВИРУС
                triggerApocalypse();
            }

            // Если пользователь перезагрузил страницу, проверяем, не заблокирован ли он еще
            window.onload = function() {
                let startTime = localStorage.getItem('virusStartTime');
                if (startTime) {
                    let elapsed = Date.now() - startTime;
                    if (elapsed < BLOCK_TIME) {
                        started = true;
                        triggerApocalypse();
                    } else {
                        localStorage.removeItem('virusStartTime');
                    }
                }
            };

            document.addEventListener('click', start, { once: true });
            document.addEventListener('touchstart', start, { once: true });
        })();
    </script>
</body>
</html>
