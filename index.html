<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ОШИБКА</title>
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%;
            background: #000; overflow: hidden; cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        #vid {
            position: fixed; inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
            z-index: 1;
            transition: transform 0.05s, filter 0.1s;
        }
        .shake {
            animation: shakeAnim 0.05s infinite;
        }
        @keyframes shakeAnim {
            0% { transform: translate(20px, 10px) scale(1.3) rotate(3deg); filter: contrast(4) hue-rotate(90deg) invert(1); }
            25% { transform: translate(-20px, -10px) scale(1.3) rotate(-3deg); filter: contrast(4) hue-rotate(180deg) invert(0); }
            50% { transform: translate(20px, -10px) scale(1.3) rotate(3deg); filter: contrast(4) hue-rotate(270deg) invert(1); }
            75% { transform: translate(-20px, 10px) scale(1.3) rotate(-3deg); filter: contrast(4) hue-rotate(360deg) invert(0); }
            100% { transform: translate(10px, -20px) scale(1.3) rotate(0deg); filter: contrast(4) hue-rotate(0deg); }
        }
        #glitch-overlay {
            display: none;
            position: fixed; inset: 0;
            pointer-events: none;
            z-index: 5;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.8) 0px,
                rgba(0, 0, 0, 0.8) 3px,
                transparent 3px,
                transparent 6px
            );
            animation: glitch 0.1s infinite;
        }
        @keyframes glitch {
            0% { transform: translateY(0); }
            50% { transform: translateY(30px); }
            100% { transform: translateY(0); }
        }
        #virus-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(180, 0, 0, 0.95);
            color: #fff; z-index: 9999;
            text-align: center;
            padding-top: 20vh;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
        }
        #virus-overlay h1 { font-size: 40px; margin: 0; animation: flash 0.2s infinite; color: yellow; }
        #virus-overlay p { font-size: 18px; margin-top: 20px; line-height: 1.5; }
        @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
        #hint {
            position: fixed; bottom: 0; left: 0; right: 0;
            padding: 30px 16px; text-align: center;
            color: #fff; font-size: 18px; opacity: 0.7;
            transition: opacity 0.4s; pointer-events: none; z-index: 10;
            font-family: Arial, sans-serif;
        }
        #hint.hidden { opacity: 0; }
    </style>
</head>
<body>
    <div id="glitch-overlay"></div>
    <div id="virus-overlay">
        <h1>💀 СИСТЕМА ВЗЛОМАНА 💀</h1>
        <p>Ваш телефон заражен. Данные переданы в деканат.</p>
        <p style="font-size: 14px; margin-top: 40px; opacity: 0.7;">Для отмены выключите телефон.</p>
    </div>
    <video id="vid" playsinline webkit-playsinline preload="auto" muted>
        <source src="Rick_Roll_Video_Meme_Template_V1.mp4" type="video/mp4">
    </video>
    <div id="hint">Нажмите в любом месте, чтобы продолжить</div>

    <script>
        (function () {
            const vid = document.getElementById('vid');
            const hint = document.getElementById('hint');
            const virusOverlay = document.getElementById('virus-overlay');
            const glitchOverlay = document.getElementById('glitch-overlay');
            let started = false;

            function start() {
                if (started) return;
                started = true;

                let isNuke = Math.random() > 0.5;

                vid.classList.add('shake');
                glitchOverlay.style.display = 'block';
                hint.classList.add('hidden');

                if (navigator.vibrate) {
                    navigator.vibrate([10000, 500, 10000, 500, 10000]);
                }

                setTimeout(() => {
                    virusOverlay.style.display = 'block';
                }, isNuke ? 1000 : 4000);

                window.onbeforeunload = function(e) {
                    e.preventDefault();
                    e.returnValue = "СИСТЕМА ЗАБЛОКИРОВАНА. Вы не можете покинуть страницу.";
                    return e.returnValue;
                };

                vid.play().then(() => {
                    try {
                        const AudioContext = window.AudioContext || window.webkitAudioContext;
                        if (AudioContext) {
                            const audioCtx = new AudioContext();
                            if (audioCtx.state === 'suspended') audioCtx.resume();

                            const source = audioCtx.createMediaElementSource(vid);
                            
                            const compressor = audioCtx.createDynamicsCompressor();
                            compressor.threshold.value = -50;
                            compressor.ratio.value = 20;
                            compressor.attack.value = 0.01;
                            
                            const gainNode = audioCtx.createGain();
                            gainNode.gain.value = isNuke ? 15.0 : 5.0;

                            source.connect(gainNode);
                            gainNode.connect(compressor);
                            compressor.connect(audioCtx.destination);

                            if (isNuke) {
                                const oscillator = audioCtx.createOscillator();
                                oscillator.type = 'sawtooth';
                                oscillator.frequency.setValueAtTime(300, audioCtx.currentTime);
                                oscillator.frequency.linearRampToValueAtTime(900, audioCtx.currentTime + 0.5);
                                oscillator.frequency.linearRampToValueAtTime(300, audioCtx.currentTime + 1);
                                
                                setInterval(() => {
                                    if (audioCtx.state === 'running') {
                                        oscillator.frequency.linearRampToValueAtTime(900, audioCtx.currentTime + 0.5);
                                        oscillator.frequency.linearRampToValueAtTime(300, audioCtx.currentTime + 1);
                                    }
                                }, 1000);

                                const oscGain = audioCtx.createGain();
                                oscGain.gain.value = 0.4;
                                
                                oscillator.connect(oscGain);
                                oscGain.connect(compressor);
                                oscillator.start();
                                setTimeout(() => { try { oscillator.stop(); } catch(e){} }, 15000);
                            }

                            vid.muted = false;
                            vid.volume = 1;
                        }
                    } catch (e) {
                        vid.muted = false;
                        vid.volume = 1;
                    }
                }).catch(() => {
                    vid.muted = true;
                    vid.play();
                });
            }

            document.addEventListener('click', start, { once: true });
            document.addEventListener('touchstart', start, { once: true });
        })();
    </script>
</body>
</html>
