<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚠️ КРИТИЧЕСКАЯ ОШИБКА ⚠️</title>
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%;
            background: #000; overflow: hidden; cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        #vid {
            position: fixed; inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
            transition: transform 0.05s ease-in-out, filter 0.1s;
            z-index: 1;
        }
        .shake {
            animation: shakeAnim 0.08s infinite;
        }
        @keyframes shakeAnim {
            0% { transform: translate(15px, 10px) scale(1.3) rotate(2deg); filter: contrast(3) hue-rotate(90deg) invert(1); }
            25% { transform: translate(-15px, -10px) scale(1.3) rotate(-2deg); filter: contrast(3) hue-rotate(180deg) invert(0); }
            50% { transform: translate(15px, -10px) scale(1.3) rotate(2deg); filter: contrast(3) hue-rotate(270deg) invert(1); }
            75% { transform: translate(-15px, 10px) scale(1.3) rotate(-2deg); filter: contrast(3) hue-rotate(360deg) invert(0); }
            100% { transform: translate(10px, -15px) scale(1.3) rotate(0deg); filter: contrast(3) hue-rotate(0deg); }
        }
        #glitch-overlay {
            display: none;
            position: fixed; inset: 0;
            pointer-events: none;
            z-index: 5;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.7) 0px,
                rgba(0, 0, 0, 0.7) 2px,
                transparent 2px,
                transparent 4px
            );
            animation: glitch 0.2s infinite;
        }
        @keyframes glitch {
            0% { transform: translateY(0); }
            50% { transform: translateY(20px); }
            100% { transform: translateY(0); }
        }
        #virus-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(150, 0, 0, 0.95);
            color: #fff; z-index: 9999;
            text-align: center;
            padding-top: 20vh;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
        }
        #virus-overlay h1 { font-size: 40px; margin: 0; animation: flash 0.3s infinite; color: yellow; }
        #virus-overlay p { font-size: 18px; margin-top: 20px; line-height: 1.5; }
        @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
        #hint {
            position: fixed; bottom: 0; left: 0; right: 0;
            padding: 30px 16px; text-align: center;
            color: #fff; font-size: 18px; opacity: 0.7;
            transition: opacity 0.4s; pointer-events: none; z-index: 10;
            font-family: Arial, sans-serif;
        }
        #hint.hidden { opacity: 0; }
    </style>
</head>
<body>
    <div id="glitch-overlay"></div>
    <div id="virus-overlay">
        <h1>💀 ВЗЛОМ СИСТЕМЫ 💀</h1>
        <p>За использование телефона на уроке<br>с вашего счета списано 500 рублей.</p>
        <p style="font-size: 14px; margin-top: 40px; opacity: 0.7;">Чтобы остановить, выключите телефон.</p>
    </div>
    <video id="vid" playsinline webkit-playsinline preload="auto" muted>
        <source src="Rick_Roll_Video_Meme_Template_V1.mp4" type="video/mp4">
    </video>
    <div id="hint">Нажмите в любом месте, чтобы продолжить</div>
    <script>
        (function () {
            const vid = document.getElementById('vid');
            const hint = document.getElementById('hint');
            const virusOverlay = document.getElementById('virus-overlay');
            const glitchOverlay = document.getElementById('glitch-overlay');
            let started = false;
            function start() {
                if (started) return;
                started = true;
                vid.classList.add('shake');
                glitchOverlay.style.display = 'block';
                if (navigator.vibrate) {
                    navigator.vibrate([3000, 200, 3000, 200, 10000]);
                }
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        const audioCtx = new AudioContext();
                        if (audioCtx.state === 'suspended') audioCtx.resume();
                        const source = audioCtx.createMediaElementSource(vid);
                        const gainNode = audioCtx.createGain();
                        gainNode.gain.value = 30.0;
                        const distortion = audioCtx.createWaveShaper();
                        function makeDistortionCurve(amount) {
                            let k = amount, n = 44100, curve = new Float32Array(n), deg = Math.PI / 180, i = 0, x;
                            for (; i < n; ++i) {
                                x = i * 2 / n - 1;
                                curve[i] = ( 3 + k ) * x * 20 * deg / ( Math.PI + k * Math.abs(x) );
                            }
                            return curve;
                        }
                        distortion.curve = makeDistortionCurve(1000);
                        const compressor = audioCtx.createDynamicsCompressor();
                        compressor.threshold.value = -80;
                        compressor.ratio.value = 20;
                        const oscillator = audioCtx.createOscillator();
                        oscillator.type = 'sawtooth';
                        oscillator.frequency.setValueAtTime(400, audioCtx.currentTime);
                        oscillator.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 1);
                        oscillator.frequency.linearRampToValueAtTime(400, audioCtx.currentTime + 2);
                        setInterval(() => {
                            if (audioCtx.state === 'running') {
                                oscillator.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 1);
                                oscillator.frequency.linearRampToValueAtTime(400, audioCtx.currentTime + 2);
                            }
                        }, 2000);
                        const oscGain = audioCtx.createGain();
                        oscGain.gain.value = 0.6;
                        source.connect(gainNode);
                        gainNode.connect(distortion);
                        distortion.connect(compressor);
                        compressor.connect(audioCtx.destination);
                        oscillator.connect(oscGain);
                        oscGain.connect(audioCtx.destination);
                        oscillator.start();
                        setTimeout(() => { 
                            try { oscillator.stop(); } catch(e){} 
                        }, 15000);
                        vid.muted = false;
                        vid.volume = 1;
                    }
                } catch (e) {
                    vid.muted = false;
                    vid.volume = 1;
                }
                vid.play().then(() => {
                    hint.classList.add('hidden');
                    setTimeout(() => {
                        virusOverlay.style.display = 'block';
                    }, 2000);
                }).catch(() => {
                    vid.muted = true;
                    vid.play().then(() => {
                        vid.muted = false;
                        hint.classList.add('hidden');
                    });
                });
                window.onbeforeunload = function(e) {
                    e.preventDefault();
                    e.returnValue = "СИСТЕМА ЗАБЛОКИРОВАНА. Вы не можете покинуть страницу, пока не оплатите штраф.";
                    return e.returnValue;
                };
            }
            document.addEventListener('click', start, { once: true });
            document.addEventListener('touchstart', start, { once: true });
        })();
    </script>
</body>
</html>
