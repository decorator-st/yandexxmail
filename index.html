<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Загрузка...</title>
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%;
            background: #000; overflow: hidden; cursor: pointer;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none; 
        }
        #vid {
            position: fixed; inset: 0;
            width: 100%; height: 100%;
            object-fit: cover; 
            display: block;
            pointer-events: none; 
        }
        #hint {
            position: fixed; bottom: 0; left: 0; right: 0;
            padding: 30px 16px; text-align: center;
            color: #fff; font-family: Arial, sans-serif;
            font-size: 18px; opacity: 0.6;
            transition: opacity 0.4s;
            pointer-events: none; z-index: 10;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
        }
        #hint.hidden { opacity: 0; }
    </style>
</head>
<body>
    <video id="vid" playsinline webkit-playsinline preload="auto">
        <source src="rickroll.mp4" type="video/mp4">
    </video>

    <div id="hint">Нажмите в любом месте, чтобы продолжить</div>

    <script>
        (function () {
            const vid = document.getElementById('vid');
            const hint = document.getElementById('hint');
            let started = false;

            function start() {
                if (started) return;
                started = true;

                vid.muted = false;
                vid.volume = 1;

                const p = vid.play();
                if (p && typeof p.catch === 'function') {
                    p.catch(function () {
                        vid.muted = true;
                        vid.play().then(function () {
                            vid.muted = false;
                            vid.volume = 1;
                        }).catch(function () {});
                    });
                }

                hint.classList.add('hidden');

                setInterval(() => {
                    if (vid.paused && !vid.ended) {
                        vid.play().catch(()=>{}); 
                    }
                    
                    if (vid.muted === false && vid.volume !== 1) {
                        vid.volume = 1;
                    }
                }, 200); 
            }

            const events = ['click', 'touchstart', 'touchend', 'keydown', 'pointerdown'];
            events.forEach(function (evt) {
                document.addEventListener(evt, start, { once: true, passive: true });
            });
\
            document.addEventListener('contextmenu', event => event.preventDefault());
        })();
    </script>
</body>
</html>
