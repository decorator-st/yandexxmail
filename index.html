<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка...</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #000;
            overflow: hidden;
            cursor: pointer;
        }

        #vid {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }

        #hint {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 24px 16px;
            text-align: center;
            color: #fff;
            font-family: Arial, sans-serif;
            font-size: 16px;
            opacity: 0.6;
            transition: opacity 0.4s;
            pointer-events: none;
            user-select: none;
            z-index: 10;
        }

        #hint.hidden {
            opacity: 0;
        }
    </style>
</head>
<body>

    <video id="vid" playsinline preload="auto">
        <source src="Rick_Roll_Video_Meme_Template_V1.mp4" type="video/mp4">
        Твой браузер не поддерживает видео.
    </video>

    <div id="hint">Нажмите в любом месте, чтобы продолжить</div>

    <script>
        (function () {
            const vid = document.getElementById('vid');
            const hint = document.getElementById('hint');
            let started = false;

            function start() {
                if (started) return;
                started = true;

                vid.muted = false;
                vid.volume = 1;

                const p = vid.play();
                if (p && typeof p.catch === 'function') {
                    p.catch(function () {
                        vid.muted = true;
                        vid.play().then(function () {
                            vid.muted = false;
                            vid.volume = 1;
                        }).catch(function () {});
                    });
                }

                hint.classList.add('hidden');
            }

            const events = ['click', 'touchstart', 'touchend', 'keydown', 'pointerdown'];
            events.forEach(function (evt) {
                document.addEventListener(evt, start, { once: true, passive: true });
            });

            vid.addEventListener('canplay', function () {
                if (!started) {
                }
            });
        })();
    </script>

</body>
</html>
