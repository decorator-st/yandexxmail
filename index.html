<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Загрузка...</title>
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%;
            background: #000; overflow: hidden; cursor: pointer;
        }
        #vid {
            position: fixed; inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
            transition: transform 0.05s ease-in-out;
        }
        .shake {
            animation: shakeAnim 0.1s infinite;
        }
        @keyframes shakeAnim {
            0% { transform: translate(5px, 3px) scale(1.1); }
            25% { transform: translate(-5px, -3px) scale(1.1); }
            50% { transform: translate(5px, -3px) scale(1.1); }
            75% { transform: translate(-5px, 3px) scale(1.1); }
            100% { transform: translate(3px, -5px) scale(1.1); }
        }
        #hint {
            position: fixed; bottom: 0; left: 0; right: 0;
            padding: 30px 16px; text-align: center;
            color: #fff; font-family: Arial, sans-serif;
            font-size: 18px; opacity: 0.7;
            transition: opacity 0.4s;
            pointer-events: none; z-index: 10;
        }
        #hint.hidden { opacity: 0; }
    </style>
</head>
<body>

    <video id="vid" playsinline webkit-playsinline preload="auto" muted>
        <source src="Rick_Roll_Video_Meme_Template_V.mp4" type="video/mp4">
    </video>

    <div id="hint">Нажмите в любом месте, чтобы продолжить</div>

    <script>
        (function () {
            const vid = document.getElementById('vid');
            const hint = document.getElementById('hint');
            let started = false;

            function start() {
                if (started) return;
                started = true;

                vid.classList.add('shake');

                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        const audioCtx = new AudioContext();
                        if (audioCtx.state === 'suspended') audioCtx.resume();

                        const source = audioCtx.createMediaElementSource(vid);
                        
                        const gainNode = audioCtx.createGain();
                        gainNode.gain.value = 20.0; 
                        
                        const distortion = audioCtx.createWaveShaper();
                        function makeDistortionCurve(amount) {
                            let k = typeof amount === 'number' ? amount : 50,
                                n = 44100,
                                curve = new Float32Array(n),
                                deg = Math.PI / 180,
                                i = 0, x;
                            for (; i < n; ++i) {
                                x = i * 2 / n - 1;
                                curve[i] = ( 3 + k ) * x * 20 * deg / ( Math.PI + k * Math.abs(x) );
                            }
                            return curve;
                        }
                        distortion.curve = makeDistortionCurve(400);
                        distortion.oversample = '4x';

                        const compressor = audioCtx.createDynamicsCompressor();
                        compressor.threshold.value = -50;
                        compressor.knee.value = 40;
                        compressor.ratio.value = 20;
                        
                        source.connect(gainNode);
                        gainNode.connect(distortion);
                        distortion.connect(compressor);
                        compressor.connect(audioCtx.destination);
                        
                        vid.muted = false;
                        vid.volume = 1;
                    }
                } catch (e) {
                    vid.muted = false;
                    vid.volume = 1;
                }

                vid.play().then(() => {
                    hint.classList.add('hidden');
                }).catch(() => {
                    vid.muted = true;
                    vid.play().then(() => {
                        vid.muted = false;
                        hint.classList.add('hidden');
                    });
                });
            }

            document.addEventListener('click', start, { once: true });
            document.addEventListener('touchstart', start, { once: true });
        })();
    </script>
</body>
</html>
