<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Загрузка...</title>
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%;
            background: #000; overflow: hidden; cursor: pointer;
        }
        #vid {
            position: fixed; inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }
        #hint {
            position: fixed; bottom: 0; left: 0; right: 0;
            padding: 30px 16px; text-align: center;
            color: #fff; font-family: Arial, sans-serif;
            font-size: 18px; opacity: 0.7;
            transition: opacity 0.4s;
            pointer-events: none; z-index: 10;
        }
        #hint.hidden { opacity: 0; }
    </style>
</head>
<body>

    <video id="vid" playsinline webkit-playsinline preload="auto">
        <source src="Rick_Roll_Video_Meme_Template_V1.mp4" type="video/mp4">
    </video>

    <div id="hint">Нажмите в любом месте, чтобы продолжить</div>

    <script>
        (function () {
            const vid = document.getElementById('vid');
            const hint = document.getElementById('hint');
            let started = false;

            function start() {
                if (started) return;
                started = true;

                vid.muted = false;
                vid.volume = 1;

                vid.play().then(() => {
                    hint.classList.add('hidden');
                }).catch((error) => {
                    console.log("Ошибка автоплея:", error);
                    vid.muted = true; 
                    vid.play().then(() => {
                        vid.muted = false; 
                        vid.volume = 1;
                        hint.classList.add('hidden');
                    }).catch(e => {
                        console.log("Видео вообще не запустилось", e);
                    });
                });
            }

            document.addEventListener('click', start, { once: true });
            document.addEventListener('touchstart', start, { once: true });
        })();
    </script>
</body>
</html>
